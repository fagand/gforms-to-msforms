# Nginx reverse proxy for the Google Forms -> Microsoft Forms converter.
#
# Install as e.g. /etc/nginx/sites-available/gforms2msforms, then:
#   sudo ln -s /etc/nginx/sites-available/gforms2msforms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace `forms.example.school.uk` with your real hostname, and point at the
# uvicorn/gunicorn socket or port configured in deploy/gforms2msforms.service.

server {
    listen 80;
    server_name forms.example.school.uk;

    # Real quiz ZIPs are tiny (a few hundred KB), but a batch of 20 with images
    # could add up — allow generous headroom.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the live progress updates (Server-Sent Events) used by the
        # conversion screen — without this, Nginx buffers the whole response and
        # the UI never sees per-file progress until everything finishes.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }
}

# --- Optional: HTTPS (recommended) ---
# Once you have a certificate (e.g. via certbot --nginx), Certbot will rewrite
# this file to add a matching `listen 443 ssl;` server block and redirect
# port 80 to it automatically. Do that rather than hand-editing TLS settings here.
