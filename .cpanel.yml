# cPanel Git Version Control auto-deploy script.
#
# This runs when you click "Deploy HEAD Commit" (or "Update from Remote" then
# "Deploy") on this repository's page under cPanel -> Git Version Control.
#
# IMPORTANT: this deliberately does NOT run the Python app directly out of the git
# storage folder (~/repositories/<name>). cPanel locks that folder's permissions
# down in a way that makes Passenger unable to read files in it directly (you'll
# see "Passengerfile.json ... Permission denied" if you try). cPanel's own intended
# pattern — and the reason .cpanel.yml deployment tasks exist at all — is to copy
# files OUT of git storage into a normal, separate application folder on every
# deploy. That's what this script does.
#
# One-time setup before this works:
#   1. In "Setup Python App", create the app with Application root = APPPATH below
#      (a NEW folder name that does not already exist — Setup Python App creates
#      it for you, with normal permissions). Do NOT point it at ~/repositories/...
#   2. Double-check the venv Python version segment below (3.13) against the exact
#      command Setup Python App shows you after creating the app — adjust if it
#      differs.
#   3. Commit and push this file, then in cPanel's Git Version Control page click
#      "Update from Remote" and "Deploy HEAD Commit".
---
deployment:
  tasks:
    - export REPOPATH=/home/fagancom/repositories/gforms-to-msforms2
    - export APPPATH=/home/fagancom/gforms-to-msforms-app
    - export VENV_PIP=/home/fagancom/virtualenv/gforms-to-msforms-app/3.13/bin/pip
    - /bin/mkdir -p $APPPATH
    - /usr/bin/rsync -a --delete --exclude='.git' --exclude='.cpanel.yml' $REPOPATH/ $APPPATH/
    - /bin/mkdir -p $APPPATH/tmp
    - if [ -x "$VENV_PIP" ]; then $VENV_PIP install -q -r $APPPATH/requirements.txt; fi
    - /bin/touch $APPPATH/tmp/restart.txt
